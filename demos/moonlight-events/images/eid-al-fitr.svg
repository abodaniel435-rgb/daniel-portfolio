      <stop offset="60%" stop-color="#0d4f6b"/>
      <stop offset="100%" stop-color="#1b6f87"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe38a"/>
      <stop offset="100%" stop-color="#e3a11c"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
