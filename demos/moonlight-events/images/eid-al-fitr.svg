<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Eid al-Fitr festival illustration</title>
  <desc id="desc">A crescent moon over lanterns and a mosque skyline for Eid al-Fitr.</desc>
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
