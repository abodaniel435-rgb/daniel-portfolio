<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D10" />
    <meta name="description" content="Campus Coin — the student money app for allowance, budgets, money health and goal jars. Built for Nigerian campus life." />
    <title>Campus Coin — money that behaves on campus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__CC_ERRORS = [];
      window.addEventListener('error', function (event) {
        window.__CC_ERRORS.push(String((event.error && event.error.stack) || event.message));
      });
      (function () {
        var original = console.error;
        console.error = function () {
          try {
            window.__CC_ERRORS.push(Array.prototype.map.call(arguments, function (item) {
              return (item && item.stack) || String(item);
            }).join(' | '));
          } catch (error) { /* ignore */ }
          original.apply(console, arguments);
        };
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
