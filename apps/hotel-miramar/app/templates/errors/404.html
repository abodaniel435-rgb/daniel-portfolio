{% extends 'base.html' %}
{% block title %}Page not found — {{ hotel_name }}{% endblock %}
{% block content %}
<section class="section" style="min-height: 62vh; display: grid; place-items: center;">
  <div class="container container--narrow text-center">
    <p class="eyebrow" style="justify-content: center;">404</p>
    <h1 class="display" style="font-size: clamp(4rem, 9vw, 7rem); margin-top: 0.5rem;">Off the map.</h1>
    <hr class="rule--brass" style="margin: 1.5rem auto;">
    <p class="muted" style="margin-inline: auto;">The page you are looking for has moved or never existed. The bay is still where you left it.</p>
    <div class="form-actions" style="justify-content: center; margin-top: 1.75rem;">
      <a class="btn" href="{{ url_for('public.index') }}">Return home</a>
      <a class="btn btn--ghost" href="{{ url_for('public.rooms') }}">View rooms</a>
    </div>
  </div>
</section>
{% endblock %}
