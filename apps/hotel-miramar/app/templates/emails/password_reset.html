<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f7f3eb;color:#2c2c2c;font-family:Arial,sans-serif;">
    <div style="max-width:620px;margin:32px auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(11,28,44,.12);">
      <div style="padding:28px 36px;background:#0b1c2c;color:#f7f3eb;font-family:Georgia,serif;font-size:25px;font-weight:bold;">Hotel Miramar <span style="color:#c9a84c;">SG</span></div>
      <div style="padding:32px 36px;line-height:1.6;">
        <h1 style="margin:0 0 14px;color:#0b1c2c;font-family:Georgia,serif;font-size:27px;">Reset your password</h1>
        <p>Hello {{ user.first_name }},</p>
        <p>We received a request to reset your password. This link expires in one hour.</p>
        <p style="margin:28px 0;"><a href="{{ reset_url }}" style="display:inline-block;padding:12px 20px;border-radius:7px;background:#c9a84c;color:#0b1c2c;text-decoration:none;font-weight:bold;">Reset password</a></p>
        <p style="font-size:14px;color:#6b6b6b;">If you did not request a reset, you can safely ignore this email. Your password will remain unchanged.</p>
      </div>
    </div>
  </body>
</html>
