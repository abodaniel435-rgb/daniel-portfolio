<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f7f3eb;color:#2c2c2c;font-family:Arial,sans-serif;">
    <div style="max-width:620px;margin:32px auto;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(11,28,44,.12);">
      <div style="padding:28px 36px;background:#0b1c2c;color:#f7f3eb;">
        <div style="font-family:Georgia,serif;font-size:25px;font-weight:bold;">Hotel Miramar <span style="color:#c9a84c;">SG</span></div>
        <div style="margin-top:12px;color:#c9a84c;font-size:14px;letter-spacing:.04em;">MESSAGE RECEIVED</div>
      </div>
      <div style="padding:32px 36px;line-height:1.6;">
        <h1 style="margin:0 0 12px;color:#0b1c2c;font-family:Georgia,serif;font-size:24px;">Thank you, {{ msg.name }}</h1>
        <p>We received your message{% if msg.subject %} about <strong>{{ msg.subject }}</strong>{% endif %} and our team will respond shortly.</p>
        <div style="padding:16px;border:1px solid #e8e4dc;border-radius:8px;background:#f7f3eb;">
          <div style="font-size:13px;color:#6b6b6b;margin-bottom:6px;">Your message:</div>
          <div style="white-space:pre-wrap;">{{ msg.message }}</div>
        </div>
        <p style="margin:20px 0 0;">Need urgent help? Contact {{ hotel_email }} or {{ hotel_phone }}.</p>
      </div>
    </div>
  </body>
</html>
