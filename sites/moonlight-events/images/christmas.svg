<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Christmas festival illustration</title>
  <desc id="desc">A decorated Christmas tree beneath a winter night sky.</desc>
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#07182f"/>
      <stop offset="100%" stop-color="#103a52"/>
    </linearGradient>
    <linearGradient id="snow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#edf7ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
